<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="6"/>

  <!-- Glowing circle -->
  <circle cx="256" cy="256" r="160" fill="url(#accent)" opacity="0.12" />

  <!-- Target & Spreadsheet Graphic -->
  <!-- Target circles -->
  <circle cx="256" cy="230" r="110" fill="none" stroke="#10b981" stroke-width="14" stroke-opacity="0.4"/>
  <circle cx="256" cy="230" r="75" fill="none" stroke="#10b981" stroke-width="12" stroke-opacity="0.7"/>
  <circle cx="256" cy="230" r="40" fill="url(#accent)"/>
  <circle cx="256" cy="230" r="16" fill="#ffffff"/>

  <!-- Upward Trend Chart Bars -->
  <rect x="130" y="360" width="44" height="60" rx="8" fill="#3b82f6" opacity="0.9"/>
  <rect x="194" y="320" width="44" height="100" rx="8" fill="#10b981"/>
  <rect x="258" y="290" width="44" height="130" rx="8" fill="url(#gold)"/>
  <rect x="322" y="240" width="44" height="180" rx="8" fill="#8b5cf6"/>

  <!-- Growth Arrow -->
  <path d="M120 330 L 230 240 L 300 270 L 390 170" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="350,170 390,170 390,210" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
